[package]
name = "mcp-door"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
description = "One shared MCP door for every SwiftSoftware product: JSON-RPC 2.0 transport, credential resolution contract, tenant scoping, 404-not-403, audit, tool registry."
license = "MIT"
repository = "https://github.com/Swiftsoftware143/mcp-door"
readme = "README.md"

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "fs", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 2
strip = true
